components:
  parameters:
    LeadId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 36
        maxLength: 36
  # Reusable error responses. Every operation references these rather than
  # restating the envelope, so the contract cannot drift per endpoint and the
  # generated client has one error type to narrow on.
  #
  # Reference the ones an operation can actually return: listing 401 on a public
  # endpoint teaches the client to handle a case that never occurs, and omitting
  # one it does return leaves the generated types wrong.
  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required, or the session has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >
        Authenticated, but lacking the required permission or tenant scope.
        Retrying with the same credentials will not succeed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: >
        The resource does not exist, or exists outside the caller's tenant.
        The two are deliberately indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request body exceeded the configured limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: >
        The request was well-formed but semantically invalid. `error.details`
        carries `fieldErrors` for field-level failures.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests. Retry after the window resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: >
        An unexpected fault. The message is generic by design; quote
        `error.requestId` when reporting it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: The service is temporarily unable to handle the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ready, shutting_down, not_ready]
      required:
        - status
    SubmitContactEnquiryRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
        phone:
          type: string
          nullable: true
        company:
          type: string
          nullable: true
        serviceInterest:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 10
      required:
        - firstName
        - lastName
        - email
        - serviceInterest
        - message
    ContactEnquiryResponse:
      type: object
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
        status:
          type: string
          enum: [received]
        message:
          type: string
      required:
        - id
        - status
        - message
    SystemHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        environment:
          type: string
        uptimeSeconds:
          type: number
          minimum: 0
        service:
          type: string
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, unavailable]
          required:
            - database
      required:
        - status
        - timestamp
        - version
        - environment
        - uptimeSeconds
        - service
        - checks
    SystemVersionResponse:
      type: object
      properties:
        version:
          type: string
        environment:
          type: string
        buildSha:
          type: string
          nullable: true
        buildTime:
          type: string
          format: date-time
          nullable: true
        nodeVersion:
          type: string
      required:
        - version
        - environment
        - buildSha
        - buildTime
        - nodeVersion
    AuthSessionResponse:
      type: object
      properties:
        userId:
          type: string
        organizationId:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
      required:
        - userId
        - organizationId
        - roles
        - permissions
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 1
        rememberMe:
          type: boolean
        organizationId:
          type: string
      required:
        - email
        - password
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/AuthSessionResponse"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/AuthUserSummary"
          required:
            - user
    AuthUserSummary:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
