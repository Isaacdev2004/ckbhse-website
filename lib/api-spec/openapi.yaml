    ErrorResponse:
      type: object
      description: >
        Standard error envelope returned by every failing endpoint. The `code`
        enum is kept in lockstep with `ErrorCode` in
        `lib/platform/src/errors`; adding a code requires updating both.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: >
                Stable, machine-readable classification. Clients branch on this
                rather than on the HTTP status or the message text.
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - payload_too_large
                - unprocessable_entity
                - rate_limited
                - internal_error
                - service_unavailable
            message:
              type: string
              description: >
                Human-readable summary. Safe to display for expected errors;
                generic for internal faults, which never disclose their cause.
            details:
              type: object
              description: >
                Structured, client-safe detail. Carries `fieldErrors` for
                validation failures; otherwise error-specific.
              properties:
                fieldErrors:
                  type: array
                  items:
                    $ref: "#/components/schemas/FieldError"
              additionalProperties: true
            requestId:
              type: string
              description: >
                Correlation id, matching the `x-request-id` response header and
                the server logs. Quote it when reporting a fault.
          required:
            - code
            - message
      required:
        - error
