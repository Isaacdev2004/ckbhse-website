openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness check
      description: >
        Returns ok while the process is running. Does not check downstream
        dependencies, so a database outage will not cause instance restarts.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: >
        Reports whether this instance should receive traffic. Returns 503 during
        graceful shutdown so the load balancer drains it before exit.
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Not accepting traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ready, shutting_down]
      required:
        - status
    ErrorResponse:
      type: object
      description: Standard error envelope returned by every failing endpoint.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - payload_too_large
                - unprocessable_entity
                - rate_limited
                - internal_error
                - service_unavailable
            message:
              type: string
            details:
              description: Field-level validation detail, when applicable.
            requestId:
              type: string
          required:
            - code
            - message
      required:
        - error
