openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness check
      description: >
        Returns ok while the process is running. Does not check downstream
        dependencies, so a database outage will not cause instance restarts.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: >
        Reports whether this instance should receive traffic. Returns 503 during
        graceful shutdown so the load balancer drains it before exit.
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Not accepting traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
components:
  # Reusable error responses. Every operation references these rather than
  # restating the envelope, so the contract cannot drift per endpoint and the
  # generated client has one error type to narrow on.
  #
  # Reference the ones an operation can actually return: listing 401 on a public
  # endpoint teaches the client to handle a case that never occurs, and omitting
  # one it does return leaves the generated types wrong.
  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required, or the session has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >
        Authenticated, but lacking the required permission or tenant scope.
        Retrying with the same credentials will not succeed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: >
        The resource does not exist, or exists outside the caller's tenant.
        The two are deliberately indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request body exceeded the configured limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: >
        The request was well-formed but semantically invalid. `error.details`
        carries `fieldErrors` for field-level failures.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests. Retry after the window resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: >
        An unexpected fault. The message is generic by design; quote
        `error.requestId` when reporting it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: The service is temporarily unable to handle the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ready, shutting_down]
      required:
        - status
    FieldError:
      type: object
      description: A single field-level validation failure.
      properties:
        path:
          type: string
          description: Dotted path to the offending field, e.g. `contact.email`.
        message:
          type: string
      required:
        - path
        - message
    ErrorResponse:
      type: object
      description: >
        Standard error envelope returned by every failing endpoint. The `code`
        enum is kept in lockstep with `ErrorCode` in
        `lib/platform/src/errors`; adding a code requires updating both.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: >
                Stable, machine-readable classification. Clients branch on this
                rather than on the HTTP status or the message text.
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - payload_too_large
                - unprocessable_entity
                - rate_limited
                - internal_error
                - service_unavailable
            message:
              type: string
              description: >
                Human-readable summary. Safe to display for expected errors;
                generic for internal faults, which never disclose their cause.
            details:
              type: object
              description: >
                Structured, client-safe detail. Carries `fieldErrors` for
                validation failures; otherwise error-specific.
              properties:
                fieldErrors:
                  type: array
                  items:
                    $ref: "#/components/schemas/FieldError"
              additionalProperties: true
            requestId:
              type: string
              description: >
                Correlation id, matching the `x-request-id` response header and
                the server logs. Quote it when reporting a fault.
          required:
            - code
            - message
      required:
        - error
