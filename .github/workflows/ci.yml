name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm -r --if-present run build

      # Guards the BRS requirement that the API contract is generated, not
      # hand-written: regenerating must not change anything that is committed.
      - name: Verify generated API client is in sync with the OpenAPI spec
        run: |
          pnpm --filter @workspace/api-spec run codegen
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated API code is stale. Run 'pnpm --filter @workspace/api-spec run codegen' and commit the result."
            git --no-pager diff
            exit 1
          fi
